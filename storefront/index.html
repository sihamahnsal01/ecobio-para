<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/iconLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="//unpkg.com/supersimpledev/dayjs.js"></script>
    <title>Eco&Bio - para</title>
    <script>
      // Pick the splash colours before anything renders (same rule as components/theme.jsx).
      try {
        var t = localStorage.getItem('ecobio_theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark-boot');
      } catch (e) {}
    </script>
    <style>
      /* ---- Splash / loading screen (shows instantly, before React loads) ---- */
      #app-loader{
        position:fixed; inset:0; z-index:99999;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
        background:linear-gradient(-45deg,#D8F0E5,#bde8cf,#9fdcb9,#D8F0E5);
        background-size:300% 300%;
        animation:loaderBg 8s ease infinite;
        transition:opacity .6s ease, visibility .6s ease;
      }
      .dark-boot, .dark-boot body{ background:#0F1612; }
      .dark-boot #app-loader{ background:linear-gradient(-45deg,#0F1612,#16261d,#1D2E24,#0F1612); background-size:300% 300%; }
      .dark-boot #app-loader .loader-name{ color:#E3ECE5; }
      .dark-boot #app-loader .loader-bar{ background:rgba(227,236,229,.15); }
      .dark-boot #app-loader .loader-bar span{ background:#7ED9A8; }
      #app-loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
      #app-loader .loader-logo{
        width:120px; height:120px; object-fit:contain;
        animation:loaderPulse 1.8s ease-in-out infinite;
      }
      #app-loader .loader-name{
        margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        font-size:1.4rem; font-weight:700; letter-spacing:.04em; color:#3C4D3C;
      }
      #app-loader .loader-bar{
        width:160px; height:4px; border-radius:4px; overflow:hidden; background:rgba(60,77,60,.15);
      }
      #app-loader .loader-bar span{
        display:block; width:40%; height:100%; border-radius:4px; background:#3C4D3C;
        animation:loaderSlide 1.2s ease-in-out infinite;
      }
      @keyframes loaderBg{ 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
      @keyframes loaderPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
      @keyframes loaderSlide{ 0%{transform:translateX(-100%)} 100%{transform:translateX(250%)} }
      @media (prefers-reduced-motion: reduce){
        #app-loader, #app-loader .loader-logo, #app-loader .loader-bar span{ animation:none; }
      }
    </style>
    <noscript><style>#app-loader{display:none}</style></noscript>
  </head>
  <body>
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading">
      <img class="loader-logo" src="/iconLogo.png" alt="" />
      <p class="loader-name">Eco&amp;Bio Para</p>
      <div class="loader-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
